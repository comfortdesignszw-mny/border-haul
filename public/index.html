<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BorderHaul — Southern Africa Freight Board</title>
<meta name="description" content="Offline-first freight board connecting truckers and shippers across Southern Africa.">
<meta name="theme-color" content="#12161F">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BorderHaul">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#12161F;--s1:#1A212B;--s2:#232C39;--line:#2E3846;--tx:#ECE9E0;--mu:#9AA3B2;--or:#E1571F;--or2:#C94A17;--go:#D9A93C;--gr:#4FB07D;--rd:#E5604D;--bl:#6BA8D6;--paper:#E4DFCE;--r:12px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
h1,h2,h3{margin:0;letter-spacing:-.01em}
h2{font-size:20px;margin-bottom:12px}
h3{font-size:15px;margin:18px 0 8px}
p{margin:0 0 10px}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:720px;margin:0 auto;min-height:100vh}
.mu{color:var(--mu)}
.sm{font-size:13px}
.logo{width:30px;height:30px;border-radius:8px;flex:none;display:block}
.logo.big{width:72px;height:72px;border-radius:18px;margin-bottom:14px}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* header + nav */
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(18,22,31,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr h1{font-size:18px;font-weight:800}
.hdr h1 b{color:var(--or)}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);padding:5px 10px;border:1px solid var(--line);border-radius:99px;background:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rd);flex:none}
.dot.on{background:var(--gr)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px;padding:0;cursor:pointer}
main{padding:14px 16px 100px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;display:flex;background:var(--s1);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;background:none;border:0;color:var(--mu);font-size:11px;position:relative;cursor:pointer}
nav.tabs button.on{color:var(--or)}
.cnt{position:absolute;top:4px;left:calc(50% + 6px);background:var(--or);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 5px;min-width:16px;text-align:center}

/* controls */
.btn{appearance:none;border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--or);color:#fff;cursor:pointer;text-align:center}
.btn:active{background:var(--or2)}
.btn.s{background:transparent;border:1px solid var(--line);color:var(--tx)}
.btn.d{background:transparent;border:1px solid #5a2b27;color:var(--rd)}
.btn.g{background:var(--gr);color:#0c1a12}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.w{width:100%}
.btn[disabled]{opacity:.5}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:15;border-radius:99px;padding:13px 20px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 14px;color:var(--mu);font-weight:700;cursor:pointer}
.seg button.on{background:var(--or);color:#fff}
.seg i{font-style:normal;font-weight:500;opacity:.8;margin-left:4px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select{flex:1;min-width:130px}
input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--or);outline-offset:1px}
label{display:block;font-size:12px;color:var(--mu);font-weight:600}
label>input,label>select,label>textarea{margin-top:4px;color:var(--tx);font-weight:400;font-size:15px}
.stack>*+*{margin-top:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gps-note{font-size:12px;color:var(--mu);margin-top:6px}

/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.item{cursor:pointer}.item:active{background:var(--s2)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.t{font-weight:700;font-size:16px}
.sub{color:var(--mu);font-size:13px}
.price{font-weight:800;color:var(--paper);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--s2);color:var(--mu)}
.chip.ok{color:var(--gr)}.chip.no{color:var(--rd)}.chip.you{background:rgba(225,87,31,.16);color:#ff8f5e}
.badge{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--s2);color:var(--mu)}
.b-ok{background:rgba(79,176,125,.16);color:var(--gr)}.b-go{background:rgba(217,169,60,.16);color:var(--go)}.b-bl{background:rgba(107,168,214,.16);color:var(--bl)}.b-rd{background:rgba(229,96,77,.16);color:var(--rd)}
.empty{text-align:center;color:var(--mu);padding:36px 12px}
.empty .btn{margin-top:12px}
.banner{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;background:var(--s1);font-size:13px}
.banner.ro{border-color:#4a4120;background:rgba(217,169,60,.08);color:var(--go)}
.banner.me{border-color:#3a2a22;background:rgba(225,87,31,.08);color:#ff9a6c}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.facts div{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.facts span{display:block;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.facts b{font-size:15px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.dim{opacity:.55}
.unread{border-left:3px solid var(--or)}
.match-pct{font-weight:800;color:var(--gr)}

/* map */
.map{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.map text{fill:#59647a;font-size:11px;letter-spacing:.08em;text-anchor:middle}
.pin{cursor:pointer}

/* chat */
.msgs{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.m{max-width:82%;padding:8px 12px;border-radius:14px;background:var(--s2);align-self:flex-start;word-wrap:break-word;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--or);color:#fff}
.m.sys{align-self:center;background:none;color:var(--mu);font-size:12px;text-align:center}
.m small{display:block;opacity:.7;font-size:11px;margin-top:2px}
.m small button{background:none;border:0;color:inherit;text-decoration:underline;padding:0 0 0 6px;cursor:pointer;font-size:11px}
.composer{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;gap:8px;background:var(--bg);padding:8px 0}
.thead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.thead .t{flex:1}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;padding:7px;color:var(--tx);display:grid;place-items:center;cursor:pointer}

/* sheet + gate */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(5,8,12,.72)}
.panel{position:relative;width:100%;max-width:720px;max-height:92vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom))}
.grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
#gate{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;display:flex;justify-content:center}
.gin{width:100%;max-width:440px;padding:calc(34px + env(safe-area-inset-top)) 20px 30px}
.gin h1{font-size:30px;font-weight:800}
.gin h1 b{color:var(--or)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role{position:relative;display:block}
.role input{position:absolute;opacity:0}
.role div{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--s1)}
.role input:checked+div{border-color:var(--or);background:rgba(225,87,31,.1)}
.role b{display:block;color:var(--tx);font-size:15px}
.role span{font-size:12px;color:var(--mu);font-weight:400}
.err{color:var(--rd);font-size:13px;min-height:18px}
.shgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--paper);color:#1a1a1a;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="logo" viewBox="0 0 512 512">
<rect width="512" height="512" fill="#12161F"/>
<rect x="88" y="168" width="222" height="146" rx="10" fill="#E4DFCE"/>
<path d="M118 286 L168 222 L214 262 L276 196" fill="none" stroke="#E1571F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="276" cy="196" r="12" fill="#E1571F"/>

<path d="M338 222h32l30 34h-62z" fill="#12161F"/>

<g fill="#12161F" stroke="#E4DFCE" stroke-width="12"><circle cx="150" cy="338" r="32"/><circle cx="238" cy="338" r="32"/><circle cx="376" cy="338" r="32"/></g>
<g fill="#C9962E"><circle cx="150" cy="338" r="9"/><circle cx="238" cy="338" r="9"/><circle cx="376" cy="338" r="9"/></g>

</symbol>

</svg>

<div id="app">
  <header class="hdr" id="hdr"></header>
  <main id="main"></main>
  <nav class="tabs" id="nav" aria-label="Main"></nav>
</div>
<div id="sheet" class="sheet" hidden><div class="scrim" data-act="closeSheet"></div><div class="panel" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div id="gate" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;color:#fff">BorderHaul needs JavaScript.</p></noscript>

<script>
(()=>{"use strict";
/* ======================================================================
   BorderHaul — offline-first freight board.
   All data lives on this device (localStorage). No network requests.
   ====================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const now=()=>Date.now();
const clip=(s,n)=>String(s==null?"":s).trim().slice(0,n);

/* ---------- reference data ---------- */
const CITIES=[
["Harare","Zimbabwe",-17.8292,31.0522],["Bulawayo","Zimbabwe",-20.15,28.5833],["Mutare","Zimbabwe",-18.9707,32.6709],["Gweru","Zimbabwe",-19.45,29.8167],["Masvingo","Zimbabwe",-20.0744,30.8328],["Beitbridge","Zimbabwe",-22.2167,30.0],["Victoria Falls","Zimbabwe",-17.9243,25.8572],["Chirundu","Zimbabwe",-16.0333,28.85],
["Johannesburg","South Africa",-26.2041,28.0473],["Pretoria","South Africa",-25.7479,28.2293],["Durban","South Africa",-29.8587,31.0218],["Cape Town","South Africa",-33.9249,18.4241],["Gqeberha","South Africa",-33.9608,25.6022],["Polokwane","South Africa",-23.9045,29.4689],["Musina","South Africa",-22.3405,30.0448],
["Lusaka","Zambia",-15.3875,28.3228],["Ndola","Zambia",-12.9587,28.6366],["Kitwe","Zambia",-12.8024,28.2132],["Livingstone","Zambia",-17.8419,25.8543],["Chipata","Zambia",-13.6333,32.65],["Kasumbalesa","Zambia",-12.27,27.795],
["Windhoek","Namibia",-22.5609,17.0658],["Walvis Bay","Namibia",-22.9576,14.5053],
["Gaborone","Botswana",-24.6282,25.9231],["Francistown","Botswana",-21.167,27.5084],["Kasane","Botswana",-17.8,25.15],
["Lilongwe","Malawi",-13.9626,33.7741],["Blantyre","Malawi",-15.7861,35.0058],
["Maputo","Mozambique",-25.9692,32.5732],["Beira","Mozambique",-19.8317,34.8389],["Tete","Mozambique",-16.1564,33.5867],
["Dar es Salaam","Tanzania",-6.7924,39.2083],["Mbeya","Tanzania",-8.9094,33.4608],["Tunduma","Tanzania",-9.3,32.7667]
].map(([name,country,lat,lon])=>({name,country,lat,lon}));
const COUNTRIES=[...new Set(CITIES.map(c=>c.country))].sort();
const CURRENCIES=["USD","ZAR","ZMW","NAD","BWP","MWK","MZN","TZS","ZWG"];
const TRUCK_TYPES=["Flatbed","Tautliner / curtain-side","Refrigerated","Tanker","Container / interlink","Livestock carrier","Lowbed / abnormal","Box / dry van"];
const CARGO=["General freight","Maize / grain","Copper / minerals","Tobacco","Cement / building","Fuel (tanker)","Perishables (cold chain)","Livestock","Timber","Fertiliser","Containerised cargo","Machinery / abnormal load"];
const BORDERS=[
["Beitbridge","South Africa ⇄ Zimbabwe","4–24 hrs, peaks Dec/Easter",["Passport / driver ID","Vehicle registration & fitness","Cross-border road carrier permit","Customs bill of entry / T1","COMESA yellow card insurance","Cargo manifest & invoice"]],
["Chirundu","Zimbabwe ⇄ Zambia","2–8 hrs",["Passport","Vehicle registration","Road access / carbon tax receipt","Bill of entry","Third-party insurance","Cargo manifest"]],
["Kazungula Bridge","Zambia ⇄ Botswana","1–4 hrs",["Passport","Vehicle registration","Bridge toll receipt","COMESA / SADC insurance","Customs declaration"]],
["Kasumbalesa","Zambia ⇄ DRC (copper corridor)","6–48 hrs, congestion common",["Passport","Vehicle registration","Customs bond","Cargo / mineral certificates","Carrier licence"]],
["Mwami / Mchinji","Zambia ⇄ Malawi","1–3 hrs",["Passport","Vehicle registration","COMESA insurance","Bill of entry","Cargo manifest"]],
["Nakonde / Tunduma","Zambia ⇄ Tanzania","4–24 hrs",["Passport","Vehicle registration","Tanzania transit / road permits","Customs bond / transit document","Cargo manifest"]],
["Ressano Garcia / Lebombo","Mozambique ⇄ South Africa","2–6 hrs",["Passport","Vehicle registration","Cross-border charges receipt","Bill of entry","Cargo manifest & invoice"]],
["Machipanda","Mozambique ⇄ Zimbabwe","2–10 hrs",["Passport","Vehicle registration","Third-party insurance","Bill of entry","Cargo manifest"]],
["Mamuno / Buitepos","Botswana ⇄ Namibia","Under 2 hrs",["Passport","Vehicle registration","Cross-border charges receipt","Cargo manifest"]]
];
const city=n=>CITIES.find(c=>c.name===n);
const cityOpts=sel=>CITIES.map(c=>[c.name,c.name+" · "+c.country]);

/* ---------- helpers ---------- */
const money=(n,c)=>n>0?c+" "+Number(n).toLocaleString("en"):"Price on request";
const ago=t=>{const s=(now()-t)/1000;return s<60?"just now":s<3600?Math.floor(s/60)+"m ago":s<86400?Math.floor(s/3600)+"h ago":Math.floor(s/86400)+"d ago"};
const dshort=d=>d?new Date(d+"T00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"}):"Flexible date";
const km=(a,b,c,d)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))};
const opts=(arr,sel)=>arr.map(v=>{const a=Array.isArray(v)?v:[v,v];return `<option value="${esc(a[0])}"${a[0]===sel?" selected":""}>${esc(a[1])}</option>`}).join("");
const digits=s=>String(s||"").replace(/\D/g,"");
let tt;function toast(m,ms){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),ms||2800)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast("Copied")}catch(e){const a=document.createElement("textarea");a.value=text;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Copied")}catch(_){toast("Copy isn't available here")}a.remove()}}
const getPos=()=>new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error("no gps"));navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude}),rej,{enableHighAccuracy:true,timeout:12000,maximumAge:60000})});
const nearest=(lat,lon)=>CITIES.reduce((b,c)=>km(lat,lon,c.lat,c.lon)<km(lat,lon,b.lat,b.lon)?c:b);
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${n}"/></svg>`;

/* ---------- storage ---------- */
const KEY="bh2";
const fresh=()=>({v:2,profiles:[],loads:[],trucks:[],requests:[],threads:[],messages:[],notifs:[],mk:{}});
function loadDB(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.v===2)return Object.assign(fresh(),d)}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast("Device storage is full. Export a backup, then clear old data.",5000)}}
let db=loadDB();

/* ---------- password hashing (local gate) ---------- */
function sha256(bytes){
  const rr=(v,a)=>(v>>>a)|(v<<(32-a)),mp=Math.pow,mw=4294967296,H=[],K=[],isc={};let pc=0;
  for(let c=2;pc<64;c++){if(!isc[c]){for(let i=0;i<313;i+=c)isc[i]=c;if(pc<8)H[pc]=(mp(c,.5)*mw)|0;K[pc++]=(mp(c,1/3)*mw)|0}}
  const len=bytes.length,pad=new Uint8Array(((len+9+63)>>6)<<6);pad.set(bytes);pad[len]=128;
  const dv=new DataView(pad.buffer),bl=len*8;dv.setUint32(pad.length-8,Math.floor(bl/mw));dv.setUint32(pad.length-4,bl>>>0);
  const h=H.slice();
  for(let o=0;o<pad.length;o+=64){
    const w=new Array(64);for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(b,17)^rr(b,19)^(b>>>10)))|0}
    let [a,b,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){
      const t1=(hh+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&c)^(b&c)))|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
    h[0]=(h[0]+a)|0;h[1]=(h[1]+b)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0}

async function kdf(pw,salt,mode){

const ui={tab:"board",kind:"loads",map:false,f:{country:"",type:"",cargo:""},inbox:"alerts",thread:null,sheet:null,keep:false,share:null};
const profileById=id=>db.profiles.find(p=>p.id===id);

/* ---------- matching ---------- */
function radiusFor(t){const p=profileById(t.owner);return p&&p.set&&p.set.radius?p.set.radius:150}
function match(l,t){
  const typeOK=l.truckType===t.type,capOK=t.cap>=l.weight;
  const dist=km(t.lat,t.lon,l.pLat,l.pLon),rad=radiusFor(t),near=dist<=rad,farish=dist<=rad*2;
  const ends=(l.pCountry===t.from||l.pCountry===t.to?1:0)+(l.dCountry===t.from||l.dCountry===t.to?1:0);
  const locOK=near||(farish&&ends>0);
  const priceKnown=l.price>0&&t.minPrice>0&&l.cur===t.cur,priceOK=priceKnown?l.price>=t.minPrice:null;
  let dateOK=null;if(l.date&&t.avail)dateOK=(new Date(t.avail)-new Date(l.date))/864e5<=2;
  const score=(typeOK?25:0)+(capOK?15:0)+(near?25:farish&&ends?15:ends===2?6:0)+(priceOK===true?20:priceOK===null?8:0)+(dateOK===true?15:dateOK===null?8:0);
  const hard=typeOK&&capOK&&locOK&&priceOK!==false&&dateOK!==false&&l.status==="posted"&&t.status==="available";
  return{score,hard,dist,r:[
    [typeOK?"Truck type fits":"Different truck type",typeOK],
    [capOK?`${t.cap} t covers ${l.weight} t`:`Only ${t.cap} t capacity`,capOK],
    [`${Math.round(dist)} km from pickup`,locOK],
    ...(priceOK===null?[]:[[priceOK?"Price meets minimum":"Offer below minimum",priceOK]]),
    ...(dateOK===null?[]:[[dateOK?"Dates line up":"Truck free too late",dateOK]])]}}
function announce(l,t,m){
  const route=l.pCity+" → "+l.dCity,pct=m.score+"%";
  if(wants(l.owner))notify(l.owner,"match","Truck match · "+pct,`${t.type}, ${t.cap} t in ${t.city} is ${Math.round(m.dist)} km from pickup for your ${route} load.`,{open:["trucks",t.id]});
  if(wants(t.owner))notify(t.owner,"match","Load match · "+pct,`${route}: ${l.cargo}, ${l.weight} t, ${money(l.price,l.cur)}. Pickup is ${Math.round(m.dist)} km from your truck.`,{open:["loads",l.id]})}
function wants(id){const p=profileById(id);return !!p&&(!p.set||p.set.alerts!==false)}
function pair(l,t){
  if(!isLocal(l.owner)&&!isLocal(t.owner))return;
  const key=l.id+"|"+t.id,m=match(l,t);
  if(m.hard&&m.score>=70){if(!db.mk[key]){db.mk[key]=1;announce(l,t,m)}}else delete db.mk[key]}
function runMatching(it,kind){
  if(kind==="load")db.trucks.forEach(t=>pair(it,t));else db.loads.forEach(l=>pair(l,it));save()}
function runMatchingAll(){db.loads.forEach(l=>db.trucks.forEach(t=>pair(l,t)));save()}

/* ---------- notifications ---------- */
function notify(to,type,title,body,refs){

  const n={id:uid(),to,type,title,body,refs:refs||{},ts:now(),read:false};
  db.notifs.unshift(n);if(db.notifs.length>400)db.notifs.length=400;save();

/* ---------- matches view ---------- */
function mcard(k,it,m){
  return `<article class="card item" data-act="open" data-kind="${k}" data-id="${it.id}"><div class="row"><div><div class="t">${k==="loads"?esc(it.pCity)+" → "+esc(it.dCity):esc(it.type)+" · "+it.cap+" t"}</div><div class="sub">${k==="loads"?esc(it.cargo)+" · "+it.weight+" t · "+money(it.price,it.cur):esc(it.city)+", "+esc(it.country)+" · "+(it.minPrice>0?"from "+money(it.minPrice,it.cur):"rate on request")}</div></div><div class="match-pct">${m.score}%</div></div>
  <div class="chips">${m.hard?`<span class="chip ok">Strong match</span>`:""}${m.r.map(([t,ok])=>`<span class="chip ${ok?"ok":"no"}">${ok?"✓":"✕"} ${esc(t)}</span>`).join("")}</div></article>`}
function vMatches(){
  if(!me)return `<div class="empty"><p>Sign in to see matches for your listings.</p><button class="btn" data-act="signinGate">Sign in</button></div>`;
  let h=`<p class="mu sm">Ranked by truck type, capacity, distance, price and dates. Strong matches also send an alert to both sides.</p>`,any=false;
  if(me.role==="shipper"){
    db.loads.filter(l=>l.owner===me.id&&l.status==="posted").forEach(l=>{any=true;
      const r=db.trucks.filter(t=>t.status==="available").map(t=>({t,m:match(l,t)})).filter(x=>x.m.score>=40).sort((a,b)=>b.m.score-a.m.score).slice(0,5);
      h+=`<h3>${esc(l.pCity)} → ${esc(l.dCity)} <span class="mu">· ${esc(l.cargo)}</span></h3>`+(r.length?r.map(x=>mcard("trucks",x.t,x.m)).join(""):`<div class="card mu sm">No trucks match yet. You'll get an alert when one is listed.</div>`)})}
  else{
    db.trucks.filter(t=>t.owner===me.id&&t.status==="available").forEach(t=>{any=true;
      const r=db.loads.filter(l=>l.status==="posted").map(l=>({l,m:match(l,t)})).filter(x=>x.m.score>=40).sort((a,b)=>b.m.score-a.m.score).slice(0,5);
      h+=`<h3>${esc(t.type)} · ${t.cap} t <span class="mu">· ${esc(t.city)}</span></h3>`+(r.length?r.map(x=>mcard("loads",x.l,x.m)).join(""):`<div class="card mu sm">No loads match yet. You'll get an alert when one is posted.</div>`)})}
  if(!any)h=`<div class="empty"><p>${me.role==="shipper"?"Post a load":"Post a truck"} and matching ${me.role==="shipper"?"trucks":"loads"} will show up here.</p><button class="btn" data-act="new">＋ ${me.role==="shipper"?"Post load":"Post truck"}</button></div>`;
  return h}

/* ---------- inbox: alerts + requests ---------- */
function vInbox(){
  if(!me)return `<div class="empty"><p>Sign in to see your alerts and requests.</p><button class="btn" data-act="signinGate">Sign in</button></div>`;
  const mine=db.notifs.filter(n=>n.to===me.id),inc=db.requests.filter(r=>r.to===me.id),out=db.requests.filter(r=>r.by===me.id);
  const pend=inc.filter(r=>r.status==="pending").length;
  let h="";
  if("Notification" in window&&Notification.permission==="default")h+=`<div class="banner">Get device alerts for requests and matches. <button class="btn sm" style="margin-left:8px" data-act="devNotif">Turn on</button></div>`;
  h+=`<div class="bar"><div class="seg"><button class="${ui.inbox==="alerts"?"on":""}" data-act="inboxTab" data-v="alerts">Alerts<i>${unread()}</i></button><button class="${ui.inbox==="reqs"?"on":""}" data-act="inboxTab" data-v="reqs">Requests<i>${pend}</i></button></div>${ui.inbox==="alerts"&&mine.length?`<div><button class="btn s sm" data-act="readAll">Mark read</button> <button class="btn s sm" data-act="clearAlerts">Clear</button></div>`:""}</div>`;
  if(ui.inbox==="alerts"){
    h+=mine.length?mine.map(n=>`<article class="card item${n.read?"":" unread"}" data-act="notif" data-id="${n.id}"><div class="row"><div class="t">${esc(n.title)}</div><div class="sub">${ago(n.ts)}</div></div><div class="sub">${esc(n.body)}</div></article>`).join(""):`<div class="empty">No alerts yet. Requests, replies, messages and matching hauls will appear here.</div>`}
  else{
    h+=`<h3>Received</h3>`+(inc.length?inc.map(r=>reqCard(r,true)).join(""):`<div class="card mu sm">No requests received.</div>`)+`<h3>Sent</h3>`+(out.length?out.map(r=>reqCard(r,false)).join(""):`<div class="card mu sm">No requests sent.</div>`)}
  return h}
function reqCard(r,incoming){
  const l=db.loads.find(x=>x.id===r.loadId),t=db.trucks.find(x=>x.id===r.truckId),who=profileById(incoming?r.by:r.to);
  const cls={pending:"b-go",accepted:"b-ok",declined:"b-rd",cancelled:"",expired:""}[r.status];
  return `<article class="card"><div class="row"><div><div class="t">${l?esc(l.pCity)+" → "+esc(l.dCity):"Load removed"}</div><div class="sub">${t?esc(t.type)+" · "+t.cap+" t · "+esc(t.city):"Truck removed"}</div></div><span class="badge ${cls}">${r.status}</span></div>
  <div class="sub" style="margin-top:6px">${incoming?"From":"To"} <b style="color:var(--tx)">${esc(who?who.name:"owner (outside this device)")}</b> · ${ago(r.created)}</div>${r.msg?`<p style="margin:6px 0 0">${esc(r.msg)}</p>`:""}
  <div class="acts">${incoming&&r.status==="pending"?`<button class="btn g sm" data-act="respond" data-id="${r.id}" data-v="accepted">Accept</button><button class="btn d sm" data-act="respond" data-id="${r.id}" data-v="declined">Decline</button>`:""}${!incoming&&r.status==="pending"?`<button class="btn s sm" data-act="cancelReq" data-id="${r.id}">Cancel request</button>`:""}${r.status==="accepted"?`<button class="btn sm" data-act="openThreadFor" data-id="${r.id}">Open chat</button>`:""}</div></article>`}

/* ---------- requests ---------- */
function requestSheet(k,id){
  const it=find(k,id);if(!it)return;
  if(!me)return gate("welcome");
  if(!((k==="loads"&&me.role==="trucker")||(k==="trucks"&&me.role==="shipper")))return toast(k==="loads"?"Only trucker profiles can request loads":"Only shipper profiles can request trucks");
  const mine=k==="loads"?db.trucks.filter(t=>t.owner===me.id&&t.status==="available"):db.loads.filter(l=>l.owner===me.id&&l.status==="posted");
  if(!mine.length)return openSheet(()=>`<h2>${k==="loads"?"Add a truck first":"Post a load first"}</h2><p class="mu">${k==="loads"?"You need an available truck to request a haul.":"You need an open load to request a truck."}</p><div class="acts"><button class="btn" data-act="new">${k==="loads"?"Post truck":"Post load"}</button><button class="btn s" data-act="closeSheet">Close</button></div>`);
  openSheet(()=>`<h2>${k==="loads"?"Request this haul":"Request this truck"}</h2><form data-form="request" class="stack"><input type="hidden" name="k" value="${k}"><input type="hidden" name="id" value="${id}">
  <label>${k==="loads"?"Which truck?":"Which load?"}<select name="mine">${mine.map(m=>k==="loads"?`<option value="${m.id}">${esc((m.plate?m.plate+" · ":"")+m.type+" · "+m.cap+" t · "+m.city)}</option>`:`<option value="${m.id}">${esc(m.pCity+" → "+m.dCity+" · "+m.cargo)}</option>`).join("")}</select></label>
  <label>Message (optional)<textarea name="msg" rows="2" maxlength="240" placeholder="Anything the owner should know"></textarea></label>
  <button class="btn w">Send request</button><button type="button" class="btn s w" data-act="closeSheet">Cancel</button></form>`,true)}
function respond(id,v){
  const r=db.requests.find(x=>x.id===id);if(!r||!me||r.to!==me.id||r.status!=="pending")return;
  const l=db.loads.find(x=>x.id===r.loadId),t=db.trucks.find(x=>x.id===r.truckId);
  if(v==="accepted"){
    if(!l||!t||l.status!=="posted"||t.status!=="available"){r.status="expired";r.updated=now();save();render();return toast("This listing is no longer available")}
    r.status="accepted";l.status="matched";l.truckId=t.id;t.status="booked";l.updated=t.updated=now();
    db.requests.forEach(o=>{if(o.id!==r.id&&o.status==="pending"&&(o.loadId===l.id||o.truckId===t.id)){o.status="declined";o.updated=now();notify(o.by,"declined","Request closed","The listing was matched with someone else.",{tab:"inbox"})}});
    const th=ensureThread(l,t);
    notify(r.by,"accepted","Request accepted",`${me.name} accepted your request for ${l.pCity} → ${l.dCity}. You can chat now.`,{thread:th.id});
    toast("Accepted. A chat has been opened.")}
  else{r.status="declined";notify(r.by,"declined","Request declined",`${me.name} declined your request for ${l?l.pCity+" → "+l.dCity:"a listing"}.`,{tab:"inbox"});toast("Request declined")}
  r.updated=now();save();render()}
function ensureThread(l,t){
  let th=db.threads.find(x=>x.loadId===l.id&&x.truckId===t.id);
  if(!th){th={id:uid(),loadId:l.id,truckId:t.id,a:l.owner,b:t.owner,created:now(),hidden:{}};db.threads.push(th);
    db.messages.push({id:uid(),tid:th.id,from:"sys",text:`Matched: ${l.pCity} → ${l.dCity} with ${t.type} (${t.cap} t).`,ts:now()})}
  th.hidden={};save();return th}

/* ---------- chats ---------- */
const myThreads=()=>me?db.threads.filter(t=>(t.a===me.id||t.b===me.id)&&!(t.hidden&&t.hidden[me.id])):[];
const lastMsg=id=>{const a=db.messages.filter(m=>m.tid===id);return a[a.length-1]};
function otherName(th){const o=th.a===me.id?th.b:th.a,p=profileById(o);return p?p.name:"Other party"}
function vChats(){
  if(!me)return `<div class="empty"><p>Sign in to see your conversations.</p><button class="btn" data-act="signinGate">Sign in</button></div>`;
  const a=myThreads().sort((x,y)=>((lastMsg(y.id)||{}).ts||0)-((lastMsg(x.id)||{}).ts||0));
  if(!a.length)return `<div class="empty">No conversations yet. A chat opens when a request is accepted.</div>`;
  return a.map(th=>{const l=db.loads.find(x=>x.id===th.loadId),m=lastMsg(th.id);return `<article class="card item" data-act="openThread" data-id="${th.id}"><div class="row"><div class="t">${esc(otherName(th))}</div><div class="sub">${m?ago(m.ts):""}</div></div><div class="sub">${l?esc(l.pCity)+" → "+esc(l.dCity):"Load removed"}</div>${m?`<div class="sub" style="margin-top:4px">${m.from===me.id?"You: ":""}${esc(m.text.slice(0,70))}</div>`:""}</article>`}).join("")}
function vThread(){
  const th=db.threads.find(x=>x.id===ui.thread);if(!th||!me||(th.a!==me.id&&th.b!==me.id)){ui.thread=null;return vChats()}
  const l=db.loads.find(x=>x.id===th.loadId),ms=db.messages.filter(m=>m.tid===th.id);
  return `<div class="thead"><button class="iconbtn" data-act="closeThread" aria-label="Back">${ic("back")}</button><div class="t">${esc(otherName(th))}<div class="sub">${l?esc(l.pCity)+" → "+esc(l.dCity):"Load removed"}</div></div><button class="iconbtn" data-act="shareThread" aria-label="Share conversation">${ic("share")}</button><button class="btn d sm" data-act="delThread">Delete</button></div>
  <div class="msgs">${ms.map(m=>m.from==="sys"?`<div class="m sys">${esc(m.text)}</div>`:`<div class="m${m.from===me.id?" me":""}">${esc(m.text)}<small>${ago(m.ts)}${m.from===me.id?`<button data-act="delMsg" data-id="${m.id}">delete</button>`:""}</small></div>`).join("")}</div>
  <form class="composer" data-form="msg"><input name="text" placeholder="Type a message" maxlength="1000" autocomplete="off" required><button class="btn">Send</button></form>`}
function openThread(id){const th=db.threads.find(x=>x.id===id);if(!th||!me||(th.a!==me.id&&th.b!==me.id))return;
  db.notifs.forEach(n=>{if(n.to===me.id&&n.refs&&n.refs.thread===id)n.read=true});save();ui.tab="chats";ui.thread=id;closeSheet();render()}

/* ---------- sharing ---------- */
const enc=o=>{const u=new TextEncoder().encode(JSON.stringify(o));return b64(u).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const dec=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return JSON.parse(new TextDecoder().decode(unb64(s)))};
const LKEYS=["id","owner","oName","oPhone","pCity","pLat","pLon","gps","dCity","cargo","weight","truckType","date","price","cur","notes","status","created","updated"];
const TKEYS=["id","owner","oName","oPhone","plate","type","cap","city","lat","lon","gps","from","to","avail","minPrice","cur","notes","status","created","updated"];
function shareInfo(k,it){
  const o=ownerLine(it),base=location.href.split("#")[0],pick=(src,keys)=>{const r={};keys.forEach(x=>{if(src[x]!==undefined)r[x]=src[x]});return r};
  const url=base+"#s="+enc({t:k==="loads"?"l":"t",d:Object.assign(pick(it,k==="loads"?LKEYS:TKEYS),{oName:o.name,oPhone:o.phone||""})});
  const text=k==="loads"?`🚛 Load available: ${it.pCity} → ${it.dCity}\n${it.cargo} · ${it.weight} t · ${it.truckType}\n${money(it.price,it.cur)} · ${dshort(it.date)}\nPosted by ${o.name} on BorderHaul`
    :`🚛 Truck available: ${it.type} · ${it.cap} t in ${it.city}\nCorridor: ${it.from} → ${it.to}\n${it.minPrice>0?"From "+money(it.minPrice,it.cur):"Rate on request"} · ${it.avail?"Free "+dshort(it.avail):"Free now"}\nListed by ${o.name} on BorderHaul`;
  return{title:k==="loads"?"Load: "+it.pCity+" → "+it.dCity:"Truck in "+it.city,text,url}}
function shareSheet(info){

  const r={id:uid(),loadId:l.id,truckId:t.id,by:me.id,to:target.owner,role:me.role,msg:clip(d.get("msg"),240),status:"pending",created:now(),updated:now()};
  db.requests.unshift(r);save();closeSheet();
  if(isLocal(target.owner)){notify(target.owner,"request",`${me.name} requested your ${k==="loads"?"load":"truck"}`,`${l.pCity} → ${l.dCity} · ${t.type}, ${t.cap} t${r.msg?" · “"+r.msg+"”":""}`,{tab:"inbox"});render();toast("Request sent. The owner has been alerted.")}
  else{render();const o=ownerLine(target);toast("Request saved. Send it to the owner directly.",3500);
    shareSheet({title:"BorderHaul request",text:`Hi ${o.name}, I'd like to ${k==="loads"?"haul your load":"book your truck"} (${l.pCity} → ${l.dCity}, ${t.type} ${t.cap} t). ${r.msg}`.trim(),url:""})}},
msg(f){
  const th=db.threads.find(x=>x.id===ui.thread);if(!th||!me||(th.a!==me.id&&th.b!==me.id))return;
  const text=clip(new FormData(f).get("text"),1000);if(!text)return;
  db.messages.push({id:uid(),tid:th.id,from:me.id,text,ts:now()});th.hidden={};
  const other=th.a===me.id?th.b:th.a;notify(other,"message","New message from "+me.name,text.slice(0,90),{thread:th.id});save();render();const i=$("#main .composer input");if(i)i.focus()},
profile(f){
  const d=new FormData(f),c=city(d.get("city"))||city(me.city);
  me.name=clip(d.get("name"),60)||me.name;me.city=c.name;me.country=c.country;me.lat=c.lat;me.lon=c.lon;me.phone=clip(d.get("phone"),24);me.cur=CURRENCIES.includes(d.get("cur"))?d.get("cur"):me.cur;
  [...db.loads,...db.trucks].forEach(x=>{if(x.owner===me.id){x.oName=me.name;x.oPhone=me.phone}});
  save();closeSheet();render();toast("Profile saved")},
async pw(f){
  const d=new FormData(f),mode=d.get("mode"),err=m=>{$("#perr").textContent=m};
  if(mode!=="set"&&!(await checkPw(me,d.get("old")||"")))return err("Current password is wrong.");
  if(mode==="remove"){delete me.pw;save();closeSheet();render();return toast("Password removed")}
  const n1=d.get("n1")||"";if(n1.length<4)return err("Use at least 4 characters.");if(n1!==d.get("n2"))return err("New passwords don't match.");
  await setPw(me,n1);save();closeSheet();render();toast("Password saved")}
};
const C={
filter(el){ui.f[el.dataset.k]=el.value;render()},
gpsClear(el){const f=el.form;if(f&&f.elements.lat){f.elements.lat.value="";f.elements.lon.value="";const n=$("#gpsNote");if(n)n.textContent="Using the city centre."}},
alertsToggle(el){me.set.alerts=el.checked;save();toast(el.checked?"Match alerts on":"Match alerts off")},
radius(el){me.set.radius=parseInt(el.value,10)||150;save();runMatchingAll();toast("Match radius set to "+me.set.radius+" km")},
importFile(el){const file=el.files&&el.files[0];if(!file)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||d.v!==2||!Array.isArray(d.profiles))throw 0;
    ask("Replace data on this device?","The backup replaces everything currently stored here, including profiles.","Replace",()=>{db=Object.assign(fresh(),d);save();me=null;localStorage.removeItem("bh2_last");sessionStorage.removeItem("bh2_u");render();gate(db.profiles.length?"pick":"welcome");toast("Backup restored")},true)}catch(e){toast("That file isn't a BorderHaul backup")}el.value=""};rd.readAsText(file)}
};

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  if(el.tagName==="A")return;
  const fn=A[el.dataset.act];if(fn){e.preventDefault();try{fn(el)}catch(err){console.error(err);toast("Something went wrong. Please try again.")}}});
document.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();
  Promise.resolve().then(()=>F[f.dataset.form](f)).catch(err=>{console.error(err);toast("Something went wrong. Please try again.")})});
document.addEventListener("change",e=>{const el=e.target.closest("[data-change]");if(el&&C[el.dataset.change])C[el.dataset.change](el)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet()});

/* ---------- connectivity, cross-tab sync, install, service worker ---------- */
window.addEventListener("online",()=>{render();toast("Back online")});
window.addEventListener("offline",()=>{render();toast("You're offline. Everything still works.")});
window.addEventListener("hashchange",importHash);
window.addEventListener("storage",e=>{
  if(e.key!==KEY)return;const before=new Set(db.notifs.map(n=>n.id));db=loadDB();
  if(me){me=profileById(me.id);if(!me){render();return gate(db.profiles.length?"pick":"welcome")}
    db.notifs.filter(n=>n.to===me.id&&!before.has(n.id)).forEach(n=>{toast(n.title);osNotify(n)})}
  if(!ui.keep)render()});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;if(!$("#gate").hidden||ui.tab==="me")render()});
window.addEventListener("appinstalled",()=>{deferred=null;toast("BorderHaul installed")});
if("serviceWorker" in navigator){
  let had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had)toast("Update installed. Reopen the app to use it.",6000);had=true;hdr()});
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").then(r=>{if(navigator.onLine)r.update().catch(()=>{})}).catch(()=>{})})}

/* ---------- boot ---------- */
(function boot(){
  const last=localStorage.getItem("bh2_last"),p=profileById(last);
  render();
  if(p){if(!p.pw||sessionStorage.getItem("bh2_u")===p.id)signIn(p);else gate("unlock",p.id)}
  else gate(db.profiles.length?"pick":"welcome");
  runMatchingAll();importHash()})();
})();
</script>
</body>
</html>
